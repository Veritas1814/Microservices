version: '3.8'

services:
  logging-service:
    build: ./logging_service
    ports:
      - "8001:8000"

  counter-service:
    build: ./counter_service
    ports:
      - "8002:8000"

  facade-service:
    build: ./facade_service
    ports:
      - "8000:8000"
    depends_on:
      - logging-service
      - counter-service
    environment:
      - LOGGING_URL=http://logging-service:8000
      - COUNTER_URL=http://counter-service:8000